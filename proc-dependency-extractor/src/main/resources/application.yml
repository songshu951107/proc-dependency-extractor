server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: proc-dependency-extractor
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/proc_extractor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  data:
    neo4j:
      database: neo4j

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hb.extractor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

extractor:
  ddl:
    dir: d:/HB/work_zuoye/jiaoben
    # 物理表字段元数据 xlsx 来源（information_schema.columns 导出）
    # 调用 POST /api/meta/columns/import 不传 path 时使用此默认值
    excel-path: d:/HB/work_zuoye/jiaoben/columns0818.xlsx
  meta:
    # 内网业务元数据 schema（跨库查询用），如 metadata；用环境变量 EXTRACTOR_META_SCHEMA 覆盖
    schema: ${EXTRACTOR_META_SCHEMA:}
    # 可选：仅导入指定数据源（data_source_name），留空则导入全部
    data-source: ${EXTRACTOR_META_DATA_SOURCE:}
  report:
    # 报表脚本目录（重新解析 / 上传落地都放这里）。服务器部署时改为实际路径，
    # 例如 /data/reports，用外部配置或环境变量 EXTRACTOR_REPORT_DIR 覆盖。
    dir: ${EXTRACTOR_REPORT_DIR:d:/HB/work_zuoye/reports}

# 脚本转换产物根目录（input/ 待转换，output/ 产物；可用 TRANSFORM_BASE_DIR 环境变量覆盖）
transform:
  base-dir: ${TRANSFORM_BASE_DIR:./transforms}
  # 文件名主干黑名单前缀（逗号分隔，不区分大小写）：命中则不上架、不转换
  # —— F/O 层自身加工脚本（dwa_f_* / dwa_o_* 开头）是装载脚本，无需 F→O 转换
  name-blacklist: dwa_f,dwa_o
  # 网页触发转换所需：Python 可执行文件与转换引擎目录
  # （engine-dir 下需有 transform_batch.py / transform_table_mapping.py / transform_config.json）
  python: ${TRANSFORM_PYTHON:python}
  engine-dir: ${TRANSFORM_ENGINE_DIR:.}
  convert-timeout-seconds: 120

impact:
  analysis:
    default-depth: 5
    max-depth: 20
    query-timeout: 10s
  sync:
    auto-retry: true
    retry-interval: 300000
    max-retry-count: 3

scheduler:
  neo4j-retry:
    enabled: true

logging:
  level:
    com.hb.extractor: debug
    # 关闭 Neo4j 笛卡尔积性能通知（Neo.ClientNotification.Statement.CartesianProduct）的刷屏日志。
    # 该通知无害：MATCH 均命中唯一约束/索引，实际为 1x1，不影响正确性与性能。
    org.springframework.data.neo4j.cypher.performance: 'OFF'

jwt:
  # HMAC-SHA256 密钥，长度需 >= 32 字节；生产用环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:hb-extractor-2026-secret-key-please-change-me-32}
  expire-hours: 12
