server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: proc-dependency-extractor
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/proc_extractor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  data:
    neo4j:
      database: neo4j

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hb.extractor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

extractor:
  ddl:
    dir: d:/HB/work_zuoye/jiaoben
    # 物理表字段元数据 xlsx 来源（information_schema.columns 导出）
    # 调用 POST /api/meta/columns/import 不传 path 时使用此默认值
    excel-path: d:/HB/work_zuoye/jiaoben/columns0818.xlsx

impact:
  analysis:
    default-depth: 5
    max-depth: 20
    query-timeout: 10s
  sync:
    auto-retry: true
    retry-interval: 300000
    max-retry-count: 3

nl2sql:
  api-key: ${NL2SQL_API_KEY:}
  base-url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  temperature: 0
  max-candidate-tables: 10
  max-fields-per-table: 15
  max-retries: 2
  eval-file: docs/nl2sql/questions.json

scheduler:
  neo4j-retry:
    enabled: true

logging:
  level:
    com.hb.extractor: debug
