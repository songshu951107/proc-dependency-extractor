server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: proc-dependency-extractor
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/proc_extractor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  data:
    neo4j:
      database: neo4j

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hb.extractor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

extractor:
  ddl:
    dir: d:/HB/work_zuoye/jiaoben

impact:
  analysis:
    default-depth: 5
    max-depth: 20
    query-timeout: 10s
  sync:
    auto-retry: true
    retry-interval: 300000
    max-retry-count: 3

scheduler:
  neo4j-retry:
    enabled: true

logging:
  level:
    com.hb.extractor: debug
