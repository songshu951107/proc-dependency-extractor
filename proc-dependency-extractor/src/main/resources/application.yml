server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: proc-dependency-extractor
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/proc_extractor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  data:
    neo4j:
      database: neo4j

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hb.extractor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

extractor:
  ddl:
    dir: d:/HB/work_zuoye/jiaoben
    # 物理表字段元数据 xlsx 来源（information_schema.columns 导出）
    # 调用 POST /api/meta/columns/import 不传 path 时使用此默认值
    excel-path: d:/HB/work_zuoye/jiaoben/columns0818.xlsx
  report:
    # 报表脚本目录（重新解析 / 上传落地都放这里）。服务器部署时改为实际路径，
    # 例如 /data/reports，用外部配置或环境变量 EXTRACTOR_REPORT_DIR 覆盖。
    dir: ${EXTRACTOR_REPORT_DIR:d:/HB/work_zuoye/reports}

impact:
  analysis:
    default-depth: 5
    max-depth: 20
    query-timeout: 10s
  sync:
    auto-retry: true
    retry-interval: 300000
    max-retry-count: 3

nl2sql:
  # 密钥一律走环境变量注入，代码库不保存明文（值缺失时调用方会明确报“未配置密钥”）
  api-key: ${NL2SQL_API_KEY:}
  base-url: ${NL2SQL_BASE_URL:https://api.deepseek.com/v1}
  model: deepseek-v4-flash
  temperature: 0
  max-candidate-tables: 10
  max-fields-per-table: 15
  max-retries: 2
  eval-file: docs/nl2sql/questions.json

scheduler:
  neo4j-retry:
    enabled: true

logging:
  level:
    com.hb.extractor: debug

jwt:
  # HMAC-SHA256 密钥，长度需 >= 32 字节；生产用环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:hb-extractor-2026-secret-key-please-change-me-32}
  expire-hours: 12
